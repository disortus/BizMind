app = "bizmind-frontend-disortus"
primary_region = "fra" # Франкфурт (близко к СНГ) или ams (Амстердам)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1