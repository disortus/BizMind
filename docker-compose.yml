services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizmind_backend
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/app/data/bizmind.db
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - bizmind_db_data:/app/data
    networks:
      - bizmind_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bizmind_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bizmind_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  bizmind_db_data:
    name: bizmind_db_data
    driver: local

networks:
  bizmind_network:
    name: bizmind_network
    driver: bridge
